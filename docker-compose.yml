services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sampling
      POSTGRES_PASSWORD: sampling
      POSTGRES_DB: sampling
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sampling -d sampling"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: sampling-svc:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_DSN: "postgres://sampling:sampling@db:5432/sampling?sslmode=disable"
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
